# Node.js with React
# Build a Node.js project that uses React.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: none

pr:
  - "*"

variables:
  - group: nextjs-env-variables

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Pull
    steps:
      - checkout: self
        clean: true
        fetchDepth: 0

      - script: |
          git config --global user.email "go@dubaisouth.ae"
          git config --global user.name "Genieology"
        displayName: "Configure Git"

      - script: |
          git checkout master
        displayName: "Pull from master"

  - job: BuildsAndPublish
    dependsOn: Pull
    steps:
      - checkout: self
        clean: true
        fetchDepth: 0

      - task: NodeTool@0
        inputs:
          versionSpec: "18.x"
        displayName: "Install Node.js"

      - script: "npm cache clean --force"
        displayName: "Cleaning cache"

      - script: "npm install --ignore-scripts"
        displayName: "Installing"

      - script: "npm run deploy"
        displayName: "Building"

      - task: ArchiveFiles@2
        inputs:
          rootFolderOrFile: "$(System.DefaultWorkingDirectory)"
          archiveType: "zip"
          archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
          replaceExistingArchive: true

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
          publishLocation: "pipeline"
